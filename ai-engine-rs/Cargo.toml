[package]
name = "ai-engine-rs"
version = "1.0.0"
edition = "2021"
description = "Self-play training and inference engine for SquareStrat games"
license = "Proprietary"

[[bin]]
name = "ai-engine"
path = "src/main.rs"

[dependencies]
# JSON in/out for the rules dump and stdio protocol with Node
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tiny CLI parsing
clap = { version = "4", features = ["derive"] }
# Deterministic RNG so training runs are reproducible from a seed
rand = "0.8"
rand_xoshiro = "0.6"
# Lightweight error type
anyhow = "1"
thiserror = "1"

[profile.release]
# Smaller, slower-to-build, much faster at runtime — appropriate for a
# long-running training process.
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
