# Cache headers for the GridGrove frontend.
#
# Drop these two location blocks into the server{} that serves
# chessus-frontend/build, ABOVE the catch-all `location /` that does the
# SPA fallback, then:
#
#     sudo nginx -t && sudo systemctl reload nginx
#
# ── Why this is needed ─────────────────────────────────────────────────────
#
# index.html is currently served with no Cache-Control at all - only ETag and
# Last-Modified. That does NOT mean "do not cache": with no explicit lifetime,
# RFC 9111 lets a cache pick its own using the heuristic of roughly a tenth of
# the time since Last-Modified. So a document last modified a week ago may be
# held for hours without revalidating.
#
# For a single-page app that is the worst possible file to guess about.
# index.html is the only thing naming which hashed bundle to load, so a stale
# copy pins every visitor to an old build - they keep running whatever
# main.<hash>.js it names, and a deploy appears not to have happened. That is
# consistent with a symptom seen while debugging the Discord activity: the
# served bundle contained code the running one did not appear to have.
#
# The two files need opposite treatment, and the asset filenames are what make
# that safe:
#
#   index.html         never reusable without asking. It is small, and one
#                      conditional request per page load is the price of a
#                      deploy taking effect immediately.
#
#   /static/*          content-hashed by the build, so a changed file is a
#                      changed NAME. The bytes behind one name never change,
#                      which is exactly what `immutable` is for: cache for a
#                      year and never revalidate.

# ── The entry document ─────────────────────────────────────────────────────
# `no-cache` is not "do not store" - it stores the copy and revalidates every
# time, so an unchanged file still answers 304 with no body. The cost is one
# round trip, not one download.
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    # Proxies and CDNs in between are covered by the same instruction.
    add_header Pragma "no-cache" always;
    expires off;
}

# ── Hashed build output ────────────────────────────────────────────────────
# Safe precisely because the name changes when the content does; a client
# holding an old file is holding a file nothing points at any more.
location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# ── Also worth knowing ─────────────────────────────────────────────────────
#
# If the SPA fallback is written as `try_files $uri $uri/ /index.html;`, the
# fallback serves index.html from `location /`, NOT from `location = /index.html`
# - the exact-match block above only handles a literal request for that path.
# To cover deep links as well, put the same header on the fallback:
#
#     location / {
#         try_files $uri $uri/ /index.html;
#     }
#
#     # nginx applies the headers of the location that finally serves the file,
#     # so naming the internal redirect target is what catches the fallback.
#     location @spa {
#         add_header Cache-Control "no-cache, must-revalidate" always;
#     }
#
# The simplest reliable version, if the layout allows it, is to set the header
# on the `location /` block itself and let /static/ override it - later, more
# specific prefix matches win over the catch-all:
#
#     location / {
#         try_files $uri $uri/ /index.html;
#         add_header Cache-Control "no-cache, must-revalidate" always;
#     }
#
# ── A caveat about add_header ──────────────────────────────────────────────
#
# add_header in a nested block REPLACES the inherited set rather than adding to
# it. If the parent server{} adds security headers (HSTS, X-Frame-Options and
# so on), they must be repeated inside any location that uses add_header, or
# they silently vanish for those paths. `always` only controls whether the
# header is sent on error responses too; it does not change inheritance.
#
# After reloading, confirm with:
#
#     curl -sI https://gridgrove.gg/ | grep -i cache-control
#     curl -sI https://gridgrove.gg/static/js/main.<hash>.js | grep -i cache-control
