# Cache headers for the GridGrove frontend.
#
# Installed as /etc/nginx/default.d/gridgrove-caching.conf by deploy.sh.
#
# ── Where this goes, and why NOT conf.d ────────────────────────────────────
#
# configs/nginx-site.conf lives in conf.d/ because add_header is valid at the
# http {} level. This file cannot: it contains `location` blocks, and location
# is only legal inside server {}. Dropped into conf.d/ it fails `nginx -t` with
# "location directive is not allowed here".
#
# default.d/ is the right home. On Amazon Linux / RHEL nginx packages, the
# default server {} in nginx.conf ends with `include /etc/nginx/default.d/*.conf;`
# - an include INSIDE the server block, which is exactly what location needs.
# deploy.sh checks that the include exists before installing this.
#
# ── The COOP/COEP re-declaration below is not optional ────────────────────
#
# nginx's add_header inheritance is replace, not merge: a block that defines
# ANY add_header loses EVERY add_header it would have inherited, for that block
# only. conf.d/coop-coep.conf sets Cross-Origin-Opener-Policy and
# Cross-Origin-Embedder-Policy at the http level, so adding a Cache-Control
# header here would silently strip them from these paths.
#
# For /index.html that is not cosmetic. COOP same-origin plus COEP
# credentialless are what make SharedArrayBuffer available, and Fairy
# Stockfish's threaded WASM needs it - so caching the entry document without
# re-declaring these would disable the AI engine on every page load, with
# nothing in any log to say why.
#
# The $coop_policy and $coep_policy maps are defined in coop-coep.conf at the
# http level, so they are in scope here. This file must load AFTER that one;
# the installed name sorts later than coop-coep.conf, and they are in different
# directories anyway (conf.d is included before the server block that pulls in
# default.d).

# ── The entry document ─────────────────────────────────────────────────────
#
# index.html is currently served with no Cache-Control at all - only ETag and
# Last-Modified. That does NOT mean "do not cache": with no explicit lifetime,
# RFC 9111 lets a cache pick its own, heuristically about a tenth of the time
# since Last-Modified. So a file last changed a week ago may be held for hours
# without revalidating.
#
# For a single-page app that is the worst possible file to guess about.
# index.html is the only thing naming which hashed bundle to load, so a stale
# copy pins a visitor to an old build - they keep running whatever
# main.<hash>.js it names, and a deploy appears not to have happened.
#
# `no-cache` is not "do not store": it stores the copy and revalidates every
# time, so an unchanged file still answers 304 with no body. The cost is one
# conditional request per page load, not one download.
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    # Re-declared because add_header above dropped the inherited pair. See note.
    add_header Cross-Origin-Opener-Policy   $coop_policy  always;
    add_header Cross-Origin-Embedder-Policy $coep_policy  always;
    # Stop nginx adding an Expires/Cache-Control of its own that would compete
    # with the one set above.
    expires off;
}

# ── Hashed build output ────────────────────────────────────────────────────
#
# Safe to cache forever precisely because the build content-hashes these names:
# changed content is a changed NAME, so a client holding an old file is holding
# one that nothing points at any more. `immutable` tells the browser not to
# revalidate even on a reload.
location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # Same reason as above. Assets do not need SharedArrayBuffer, but dropping
    # the headers only on some paths makes the policy harder to reason about,
    # and COEP applies to how a resource may be embedded.
    add_header Cross-Origin-Opener-Policy   $coop_policy  always;
    add_header Cross-Origin-Embedder-Policy $coep_policy  always;
    expires off;
    access_log off;
}

# ── The SPA fallback ───────────────────────────────────────────────────────
#
# Deliberately NOT handled here.
#
# If the site config serves deep links with `try_files $uri $uri/ /index.html;`
# from `location /`, that fallback is served by `location /` - NOT by the
# `location = /index.html` block above, which only matches a literal request for
# that path. Covering it means putting the same header on the catch-all, which
# lives in the main site config and is not ours to overwrite from here.
#
# Adding it there would ALSO need the COOP/COEP pair repeated, for the same
# reason. If you want that, add to the existing `location / { ... }`:
#
#     add_header Cache-Control "no-cache, must-revalidate" always;
#     add_header Cross-Origin-Opener-Policy   $coop_policy  always;
#     add_header Cross-Origin-Embedder-Policy $coep_policy  always;
#
# Until then a hard-refreshed deep link may serve a heuristically cached
# document, which is the status quo rather than a regression.
#
# ── Verifying ──────────────────────────────────────────────────────────────
#
#   curl -sI https://gridgrove.gg/index.html | grep -iE 'cache-control|cross-origin'
#   curl -sI https://gridgrove.gg/static/js/main.<hash>.js | grep -i cache-control
#
# The first MUST still show both Cross-Origin-* headers. If it does not, the
# inheritance rule has bitten and SharedArrayBuffer is gone.
