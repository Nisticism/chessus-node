# Chessus / SquareStrat — nginx site config
#
# Deployed to /etc/nginx/conf.d/chessus.conf by deploy.sh.
# The default.conf shipped with nginx-common is removed on first deploy so
# this file is the sole virtual-host definition.
#
# Requires:
#   - React build at /usr/share/nginx/html/ (copied by deploy.sh)
#   - Node.js / Express backend running on 127.0.0.1:3001 (managed by PM2)
#
# COOP / COEP headers (lines marked below) are required by the Fairy Stockfish
# threaded WebAssembly build. SharedArrayBuffer is only available in pages
# that opt into cross-origin isolation with both headers. 'credentialless' COEP
# is used instead of 'require-corp' so cross-origin images, fonts, and Google
# Analytics scripts load without needing explicit CORP headers on every asset.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Cross-origin isolation (required for Fairy Stockfish WASM threads) ---
    add_header Cross-Origin-Opener-Policy  "same-origin"    always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # React SPA — unknown paths fall back to index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy → Node.js backend (also handles WebSocket upgrades for game sockets).
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO WebSocket proxy.
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # User-uploaded files served directly from disk.
    # NOTE: add_header here overrides the server-block headers for this location
    # only (nginx inheritance rule). Uploads are static resources; they don't
    # need COOP/COEP, but do need CORP so credentialless COEP on the main page
    # can load them cross-origin without an error.
    location /uploads/ {
        alias /home/ec2-user/chessus-node/uploads/;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        # Re-add isolation headers so the SPA page keeps its isolation context
        # even when the browser evaluates this resource under credentialless COEP.
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }
}
