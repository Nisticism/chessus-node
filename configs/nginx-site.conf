# Cross-origin isolation headers required by Fairy Stockfish threaded WASM.
#
# Installed as /etc/nginx/conf.d/coop-coep.conf by deploy.sh.
# nginx includes conf.d/*.conf inside its http {} block, and add_header is
# valid at the http level. These two directives are then inherited by every
# server {} and location {} block that does NOT define its own add_header
# (the nginx inheritance rule: any add_header in a child block replaces ALL
# parent add_header directives for that block only).
#
# 'credentialless' COEP is used instead of 'require-corp' so cross-origin
# resources (Google Analytics, uploaded images, fonts) load without needing
# explicit CORP headers on every asset.
#
# Google Sign-In note: COOP same-origin sets window.opener = null in any
# cross-origin popup.  Modern Chrome uses FedCM (no popup), but Firefox,
# Safari, and older Chrome fall back to a popup-based OAuth flow that breaks
# when window.opener is null.  Login and register pages are served with
# unsafe-none COOP/COEP so the popup can post the credential back.  All other
# pages (including game pages) keep same-origin COOP so SharedArrayBuffer is
# available for Fairy Stockfish.  After a successful Google sign-in, the app
# does a hard redirect (window.location.href) so the next page load picks up
# the correct COOP policy for its route.
# The Discord activity does NOT need an exemption here, and briefly had one
# that was removed. The activity reported `framed true`: it runs in an iframe,
# and COOP applies only to top-level browsing contexts, so the header never
# reached it either way. The real cause of the failing handshake was a race in
# the SDK's ready() call, fixed by retrying it. Carving a hole in this policy
# for a document it does not apply to would weaken the isolation the AI engine
# depends on in exchange for nothing.
map $request_uri $coop_policy {
    ~^/(login|register)(/.*)?$   "unsafe-none";
    default                       "same-origin";
}
map $request_uri $coep_policy {
    ~^/(login|register)(/.*)?$   "unsafe-none";
    default                       "credentialless";
}
add_header Cross-Origin-Opener-Policy  $coop_policy  always;
add_header Cross-Origin-Embedder-Policy $coep_policy always;

# ── Cache headers ──────────────────────────────────────────────────────────
#
# Expressed as a map plus one add_header at the http level, NOT as location
# blocks. location is only legal inside server {}, and this server's nginx.conf
# has no `include /etc/nginx/default.d/*.conf` inside its server block to hang
# one on - the deploy said so out loud rather than installing nothing quietly.
# A map keyed on $request_uri does the same job from here, where add_header is
# already valid, and sits at the same level as the two above so all three
# accumulate instead of replacing each other.
#
# WHY index.html must not be cached by guesswork: it is served with only ETag
# and Last-Modified today, and no Cache-Control does not mean "do not cache".
# With no explicit lifetime a cache may invent one, heuristically about a tenth
# of the file's age. For a single-page app that is the worst file to guess
# about - index.html is the only thing naming which hashed bundle to load, so a
# stale copy pins a visitor to an old build and a deploy appears not to have
# happened.
#
# An empty value means nginx adds no header at all, which is how /api/ and
# /uploads/ are left alone: those responses are the app's to describe, and a
# second Cache-Control from here would be ambiguous rather than helpful.
map $request_uri $gg_cache_control {
    # Content-hashed by the build: changed content is a changed NAME, so these
    # are safe to keep forever and never revalidate.
    ~^/static/     "public, max-age=31536000, immutable";
    ~^/api/        "";
    ~^/uploads/    "";
    # Everything else is the SPA document - including deep links, which the
    # try_files fallback serves as index.html. "no-cache" still stores it and
    # still answers 304 when unchanged; it just refuses to skip the check.
    default        "no-cache, must-revalidate";
}
add_header Cache-Control $gg_cache_control always;
